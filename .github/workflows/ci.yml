name: CI

on:
  push:
    branches: [main, work-v2, architecture/platform-foundation]
  pull_request:
    branches: [main, work-v2, architecture/platform-foundation]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Migration safety (changed migrations only)
        run: node scripts/check-migration-safety.mjs --diff-only
        env:
          MIGRATION_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}

      - name: Environment template validation
        run: node scripts/validate-server-env.mjs --ci

  e2e:
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightline
          POSTGRES_PASSWORD: brightline
          POSTGRES_DB: brightline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brightline -d brightline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          DIRECT_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci

      - name: Seed delivery package smoke data
        run: npm run seed:delivery-smoke:empty
        env:
          DATABASE_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          DIRECT_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          DATABASE_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          DIRECT_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci

      - name: Playwright package vertical
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          DIRECT_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

  build:
    runs-on: ubuntu-latest
    needs: static

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
