name: CI

on:
  push:
    branches: [main, work-v2]
  pull_request:
    branches: [main, work-v2]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Unit tests (authz + truth locks)
        run: npm test
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightline
          POSTGRES_PASSWORD: brightline
          POSTGRES_DB: brightline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brightline -d brightline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          DIRECT_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci

      - name: Seed delivery package smoke data
        run: npm run seed:delivery-smoke:empty
        env:
          DATABASE_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          DIRECT_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          DATABASE_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          DIRECT_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci

      - name: Playwright package vertical
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          DIRECT_URL: postgresql://brightline:brightline@localhost:5432/brightline_ci
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
